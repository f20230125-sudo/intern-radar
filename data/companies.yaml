# Employers the radar watches. One entry per job board.
#   system  greenhouse | lever | ashby | workable | workday | amazon
#   slug    the employer's id on that system (for Workday, the tenant)
#   host    Workday only: wd1, wd3, wd5 ...
#   site    Workday only: the career site name inside the tenant
# Add an employer by adding an entry; `python -m radar.discover --check` confirms it answers.

