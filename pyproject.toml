[project]
name = "intern-radar"
version = "0.1.0"
description = "Student roles at UAE employers, read from the employers' own career feeds."
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "pydantic>=2.7", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]
